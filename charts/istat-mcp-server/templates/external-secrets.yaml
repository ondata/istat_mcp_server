{{- if .Values.externalSecrets.enabled }}
{{- range $key, $s := .Values.externalSecrets.secrets }}
{{- /* Secrets flagged authScoped are rendered only when auth.enabled. */}}
{{- if and $s.enabled (or (not $s.authScoped) $.Values.auth.enabled) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $s.name }}
  namespace: {{ include "istat-mcp-server.namespace" $ }}
  labels:
    {{- include "istat-mcp-server.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ $s.destinationName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $s.key }}
{{- end }}
{{- end }}
{{- end }}
