{{- $pdb := .Values.podDisruptionBudget }}
{{- if $pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "istat-mcp-server.fullname" . }}
  namespace: {{ include "istat-mcp-server.namespace" . }}
  labels:
    {{- include "istat-mcp-server.labels" . | nindent 4 }}
spec:
  {{- if $pdb.minAvailable }}
  minAvailable: {{ $pdb.minAvailable }}
  {{- end }}
  {{- if $pdb.maxUnavailable }}
  maxUnavailable: {{ $pdb.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "istat-mcp-server.selectorLabels" . | nindent 6 }}
{{- end }}
