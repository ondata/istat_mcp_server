{{- if and .Values.gateway.enabled .Values.httpsRedirect.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "istat-mcp-server.fullname" . }}-redirect
  namespace: {{ include "istat-mcp-server.namespace" . }}
  labels:
    {{- include "istat-mcp-server.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "istat-mcp-server.gateway.name" . }}
      namespace: {{ .Values.gateway.namespace | default (include "istat-mcp-server.namespace" .) }}
      sectionName: {{ .Values.httpsRedirect.listenerName }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
