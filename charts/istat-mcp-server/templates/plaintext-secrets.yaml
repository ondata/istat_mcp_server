{{- /* Fallback without External Secrets Operator: an Opaque Secret built from the plaintext map. */ -}}
{{- if not .Values.externalSecrets.enabled }}
{{- range $key, $s := .Values.externalSecrets.secrets }}
{{- if and $s.enabled (or (not $s.authScoped) $.Values.auth.enabled) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.destinationName }}
  namespace: {{ include "istat-mcp-server.namespace" $ }}
  labels:
    {{- include "istat-mcp-server.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $s.plaintext }}
  {{- if and $s.authScoped (eq (toString $v) "") }}
  {{- fail (printf "auth.enabled requires a non-empty externalSecrets.secrets.%s.plaintext.%s (or set externalSecrets.enabled=true)" $key $k) }}
  {{- end }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
