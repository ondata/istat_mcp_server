{{- $c := .Values }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "istat-mcp-server.fullname" . }}
  namespace: {{ include "istat-mcp-server.namespace" . }}
  labels:
    {{- include "istat-mcp-server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ $c.replicaCount }}
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  selector:
    matchLabels:
      {{- include "istat-mcp-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with $c.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "istat-mcp-server.selectorLabels" . | nindent 8 }}
        {{- include "istat-mcp-server.meshLabels" . | nindent 8 }}
        {{- with $c.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "istat-mcp-server.serviceAccountName" . }}
      # The server never calls the Kubernetes API, so the ServiceAccount token is not mounted.
      automountServiceAccountToken: false
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml $c.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ $c.terminationGracePeriodSeconds }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: istat-mcp-server
          securityContext:
            {{- toYaml $c.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $c.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ $c.service.port | quote }}
            {{- range $key, $value := $c.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if $c.auth.enabled }}
            - name: MCP_ISTAT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $c.auth.secretName }}
                  key: {{ $c.auth.secretKey }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ $c.probes.initialDelaySeconds }}
            periodSeconds: {{ $c.probes.periodSeconds }}
            timeoutSeconds: {{ $c.probes.timeoutSeconds }}
            failureThreshold: {{ $c.probes.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ $c.probes.initialDelaySeconds }}
            periodSeconds: {{ $c.probes.periodSeconds }}
            timeoutSeconds: {{ $c.probes.timeoutSeconds }}
            failureThreshold: {{ $c.probes.failureThreshold }}
          volumeMounts:
            # Read-only root filesystem: logs and cache are written under /tmp (see env).
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
