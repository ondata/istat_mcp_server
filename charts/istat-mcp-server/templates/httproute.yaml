{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.httpRoute.name | default (include "istat-mcp-server.fullname" .) }}
  namespace: {{ include "istat-mcp-server.namespace" . }}
  labels:
    {{- include "istat-mcp-server.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "istat-mcp-server.gateway.name" . }}
      namespace: {{ .Values.gateway.namespace | default (include "istat-mcp-server.namespace" .) }}
      sectionName: {{ .Values.httpRoute.listenerName }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # Only the MCP path is exposed; the health endpoint stays cluster-internal.
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.path | quote }}
      {{- with .Values.httpRoute.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "istat-mcp-server.fullname" . }}
          port: {{ .Values.service.port }}
          weight: 100
{{- end }}
